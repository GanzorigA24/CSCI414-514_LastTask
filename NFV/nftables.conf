flush ruleset

table inet nfv_filter {
    chain forward {
        type filter hook forward priority filter;
        policy drop;

        # Allow established connections
        ct state established,related counter accept

        # Allow Game Client to access FastAPI
        ip saddr 192.168.144.0/24 ip daddr 192.168.145.10 tcp dport 8000 counter accept

        # Allow API Server to access Redis
        ip saddr 192.168.145.10 ip daddr 192.168.146.10 tcp dport 6379 counter accept

        # Block Game Client from accessing Redis directly
        ip saddr 192.168.144.0/24 ip daddr 192.168.146.0/24 counter drop
    }
}